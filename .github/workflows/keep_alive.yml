name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 10 minutes automatically
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping to Streamlit app
        run: |
          curl -s -L --max-redirs 10 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://plant-disease-diagnostic-system.streamlit.app/" > /dev/null || true
          echo "Streamlit app pinged successfully at $(date)"
