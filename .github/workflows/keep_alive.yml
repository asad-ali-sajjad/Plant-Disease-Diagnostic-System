name: keep-awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app
        id: visit
        shell: bash
        env:
          APP_URL: https://plant-disease-diagnostic-system.streamlit.app
        run: python keep_awake.py 2>&1 | tee visit.log

      - name: Report status
        if: always()
        shell: bash
        run: |
          if grep -q "App was asleep" visit.log; then
            STATUS="😴 App was asleep, wake button clicked"
          elif grep -q "already awake" visit.log; then
            STATUS="✅ App was already awake"
          else
            STATUS="❌ Failed, check the Visit app step logs"
          fi
          echo "$STATUS"
          {
            echo "### keep-awake result"
            echo "$STATUS"
          } >> "$GITHUB_STEP_SUMMARY"